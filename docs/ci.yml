name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma SQLite DB
        run: npx prisma db push

      - name: Seed Database
        run: npx tsx prisma/seed.ts

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
